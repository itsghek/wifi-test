<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexión Wi-Fi Privada (Estilo QiFi)</title>
    <!-- Importamos la librería de renderizado local (Estilo QiFi) -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f7;
            color: #1d1d1f;
            padding: 40px 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { font-size: 14px; color: #86868b; margin-bottom: 25px; }
        .btn {
            display: inline-block;
            background-color: #0071e3;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .qr-container {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f7;
            border-radius: 12px;
            display: inline-block;
        }
        /* Centrar el QR generado internamente */
        #qrcode img { display: block; margin: 0 auto; }
    </style>
</head>
<body>

<div class="container">
    <h1>Conectarse al Wi-Fi</h1>
    <p>Escanea el código QR con tu cámara o descarga el asistente si estás en iPhone.</p>

    <!-- Opción para iPhone en pantalla completa -->
    <a href="conectar-wifi.mobileconfig" class="btn">Instalar Perfil (iPhone)</a>

    <div style="margin: 15px 0; color: #86868b; font-weight: bold;">— O BIEN —</div>

    <!-- Contenedor del código QR generado de forma local -->
    <div class="qr-container">
        <div id="qrcode"></div>
        <p style="margin: 10px 0 0 0; font-size: 12px; font-weight: bold; color: #1d1d1f;">
            Apunta con tu cámara aquí
        </p>
    </div>
</div>

<script>
    // 1. CONFIGURA AQUÍ LOS DATOS DE TU RED WI-FI (Al igual que en QiFi)
    const SSID = "SIN INTERNET";
    const PASSWORD = "Laagencia1782";
    const ENCRYPTION = "WPA"; // Deja WPA (es el estándar moderno)

    // 2. Estructura la cadena de texto universal para configuraciones Wi-Fi
    const qrData = `WIFI:S:${SSID};T:${ENCRYPTION};P:${PASSWORD};;`;

    // 3. Renderizado local (El navegador dibuja los píxeles sin enviarlos a internet)
    new QRCode(document.getElementById("qrcode"), {
        text: qrData,
        width: 200,
        height: 200,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });
</script>

</body>
</html>
