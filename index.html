<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Card</title>
    <!-- Motor de generación local de códigos QR (Privado y seguro) -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        /* Contenedor estilo tarjeta minimalista de wificard.io */
        .wifi-card {
            background: #ffffff;
            width: 100%;
            max-width: 360px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .card-header {
            background: #1d1d1f;
            color: #ffffff;
            padding: 20px;
        }
        .card-header h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .card-body {
            padding: 30px 24px;
        }
        .network-info {
            margin-bottom: 25px;
            text-align: left;
            background: #f5f5f7;
            padding: 14px 18px;
            border-radius: 14px;
        }
        .info-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #86868b;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .info-value {
            font-size: 16px;
            color: #1d1d1f;
            font-weight: 600;
            word-break: break-all;
        }
        .qr-wrapper {
            display: inline-block;
            padding: 16px;
            background: #ffffff;
            border: 2px solid #f5f5f7;
            border-radius: 18px;
            margin-bottom: 25px;
        }
        #qrcode img {
            display: block;
            margin: 0 auto;
        }
        .instructions {
            font-size: 13px;
            color: #515154;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .apple-btn {
            display: block;
            background-color: #0071e3;
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .apple-btn:hover {
            background-color: #0077ed;
        }
    </style>
</head>
<body>

<div class="wifi-card">
    <div class="card-header">
        <h1>Wi-Fi Connect</h1>
    </div>
    
    <div class="card-body">
        <!-- Información visual de la Red -->
        <div class="network-info">
            <div class="info-label">Red / SSID</div>
            <div class="info-value" id="network-name">Cargando...</div>
        </div>

        <!-- Código QR -->
        <div class="qr-wrapper">
            <div id="qrcode"></div>
        </div>

        <p class="instructions">
            Apunta con la cámara de tu teléfono al código QR para conectarte de forma automática.
        </p>

        <!-- Botón alternativo para iPhone si abren la web en el móvil -->
        <a href="conectar-wifi.mobileconfig" class="apple-btn">
            Configurar en iPhone (Asistente)
        </a>
    </div>
</div>

<script>
    // 1. CONFIGURA AQUÍ LOS DATOS DE TU RED WI-FI
    const SSID = "SIN INTERNET";
    const PASSWORD = "Laagencia1782";
    const ENCRYPTION = "WPA"; 

    // Muestra el nombre de la red de forma dinámica en la tarjeta
    document.getElementById("network-name").textContent = SSID;

    // 2. Estructura de la cadena de datos universal de Wi-Fi
    const qrData = `WIFI:S:${SSID};T:${ENCRYPTION};P:${PASSWORD};;`;

    // 3. Renderiza el QR localmente
    new QRCode(document.getElementById("qrcode"), {
        text: qrData,
        width: 180,
        height: 180,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.M
    });
</script>

</body>
</html>
